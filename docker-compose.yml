# `docker compose up` starts everything needed for development.
# Add `--profile s3-switch` to also start weedmini2 (only for testing a switch between two S3 storages).
# Uncomment RATELIMIT_STORAGE_URI under backend to use redis for rate limiting.
---
services:
  db:
    container_name: dds_database
    image: mariadb:10.11.5
    environment:
      - MYSQL_ROOT_PASSWORD=${DDS_MYSQL_ROOT_PASS}
      - MYSQL_USER=${DDS_MYSQL_USER}
      - MYSQL_PASSWORD=${DDS_MYSQL_PASS}
      - MYSQL_DATABASE=DeliverySystem
    restart: on-failure
    ports:
      - 127.0.0.1:3306:3306
    # Test to see if the database is accessible.
    # Backend waits for this with 'condition: service_healthy'
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --password=$$MYSQL_PASSWORD
      interval: 10s
      timeout: 5s
      retries: 5
      # volumes:
      #   # Config for encryption
      #   - type: bind
      #     source: ./Dockerfiles/mariadb/mariadb.conf
      #     target: /etc/mysql/conf.d/encrypt.cnf

      #   # Keys
      #   - type: bind
      #     source: ./Dockerfiles/mariadb/db-encrypt
      #     target: /etc/mysql/encrypt

  # Development service to watch for
  # changes to SCSS files and recompile static CSS
  node_builder:
    container_name: dds_nodebuilder
    build:
      dockerfile: Dockerfiles/nodebuilder.Dockerfile
      context: ./
    volumes:
      - type: bind
        source: ./dds_web/static/
        target: /build

  backend:
    container_name: dds_backend
    image: dds-backend-local:latest
    # This user will be used by default in the container.
    # When we want to run as root, change the following line
    # user: "root:root"
    user: "1001:1001"
    build:
      dockerfile: Dockerfiles/backend.Dockerfile
      context: ./
      target: base
    working_dir: /code
    command: sh -c "flask db upgrade && flask init-db $$DB_TYPE && flask run -h 0.0.0.0 -p 5000"
    environment:
      - DDS_VERSION=local-dev
      - DDS_APP_CONFIG=/code/dds_web/sensitive/dds_app.cfg
      - FLASK_DEBUG=true
      - FLASK_APP=dds_web
      - FLASK_INSTANCE_NAME=LOCAL_DEVELOPMENT

      - DB_TYPE=${DDS_DB_TYPE}
      # - RATELIMIT_STORAGE_URI=redis://dds_redis
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    ports:
      - 127.0.0.1:5000:5000
    volumes:
      # Migrations
      - type: bind
        source: ./migrations
        target: /code/migrations

      # Main website files (so can edit locally)
      - type: bind
        source: ./dds_web
        target: /code/dds_web

      # Tests directory (so can edit locally)
      - type: bind
        source: ./tests
        target: /code/tests

      # Sensitive config file: dds_app.cfg
      - type: bind
        source: $DDS_SENSITIVE_FILES
        target: /code/dds_web/sensitive

      # Logging outputs
      - type: bind
        source: $DDS_LOG_DIR
        target: /dds_web/logs

  # SeaweedFS (weed mini): all SeaweedFS components in one container, serving S3 on port 9000.
  # S3 keys come from AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY; data in /data is lost unless a volume is mounted.
  # Flags turn off weed mini defaults we don't need:
  #   -s3.autoCreateBucket=false: uploading to a missing bucket fails instead of creating it
  #   -master.telemetry=false:    no anonymous usage data sent to the SeaweedFS project
  #   -webdav=false:              no WebDAV server (for mounting storage as a network drive)
  #   -s3.port.iceberg/lance=0:   no Iceberg/Lance endpoints (data-catalog tools for analytics/ML)
  weedmini:
    container_name: dds_weed_mini
    image: chrislusf/seaweedfs:4.52
    command: >
      mini -dir=/data -s3.port=9000
      -s3.autoCreateBucket=false
      -master.telemetry=false
      -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
    ports:
      - 127.0.0.1:9000:9000
    environment:
      AWS_ACCESS_KEY_ID: weedMini
      AWS_SECRET_ACCESS_KEY: weedMiniPassword
    # NOTE: Uncomment if you want to keep your data.
    #     Mounts a folder into the container to make uploaded data persistent.
    # volumes:
    #   - type: bind
    #     source: ./weedmini-data
    #     target: /data

  # Second S3 storage, only for testing a switch between storages (--profile s3-switch)
  weedmini2:
    container_name: dds_weed_mini_2
    image: chrislusf/seaweedfs:4.52
    profiles: [s3-switch]
    command: >
      mini -dir=/data -s3.port=9000
      -s3.autoCreateBucket=false
      -master.telemetry=false
      -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
    ports:
      - 127.0.0.1:9002:9000
    environment:
      AWS_ACCESS_KEY_ID: weedMini2
      AWS_SECRET_ACCESS_KEY: weedMiniPassword2
    # NOTE: Uncomment if you want to keep your data.
    #     Mounts a folder into the container to make uploaded data persistent.
    # volumes:
    #   - type: bind
    #     source: ./weedmini2-data
    #     target: /data

  mailcatcher:
    container_name: dds_mailcatcher
    image: sj26/mailcatcher:latest
    ports:
      - 127.0.0.1:1080:1080

  redis:
    container_name: dds_redis
    image: redis:latest

  cli:
    container_name: dds_cli
    command: sh -c "pip install --upgrade -e . && tail -f /dev/null"
    build:
      dockerfile: Dockerfiles/cli.Dockerfile
      context: ./
      target: base
    environment:
      - DDS_CLI_ENV=docker-dev
    volumes:
      - type: bind
        source: ../dds_cli
        target: /code
